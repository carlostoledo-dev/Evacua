<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Evacua</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0d2556"/>
      <stop offset="1" stop-color="#071634"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa2ff"/>
      <stop offset="1" stop-color="#0a5bd8"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- sea -->
    <path d="M0 318 C70 290 120 300 180 318 S300 352 380 330 S480 296 512 300 V512 H0Z" fill="url(#sea)"/>
    <path d="M0 400 C80 372 150 384 220 402 S360 430 430 410 S500 388 512 390 V512 H0Z" fill="#0847ad"/>
    <path d="M0 360 C60 344 110 350 170 366" fill="none" stroke="#8fd0ff" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
    <!-- breaking wave -->
    <path d="M-10 330 C80 330 150 250 230 190 C300 138 400 130 446 186 C486 236 456 304 398 304 C352 304 334 262 360 236 C334 286 270 300 226 318 C150 350 60 352 -10 352Z" fill="#ffffff"/>
    <path d="M360 236 C372 222 396 222 404 240 C410 256 398 270 384 268" fill="none" stroke="#3fa2ff" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
